name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install project and development dependencies
        run: uv sync --locked --extra mcp

      - name: Build distributions
        run: uv build

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Run tests
        run: uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test browser integration
        run: node --test tests/test_extension_content.cjs tests/test_extension_item_ui.cjs tests/test_extension_item_state.cjs tests/test_extension_options.cjs integrations/chatgpt-extension/background.test.cjs

      - name: Regenerate Firefox package
        run: node integrations/build-firefox.mjs
