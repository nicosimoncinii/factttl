name: Feature or design proposal
description: Propose a scoped capability or design change
title: "proposal: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended user
      description: What concrete problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: false
